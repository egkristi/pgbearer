[package]
name = "pgbearer"
description = "pgbearer: identity-aware PostgreSQL gateway (OIDC bearer tokens to least-privilege PostgreSQL roles)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgbearer"
path = "src/main.rs"

[dependencies]
pgbearer-core = { workspace = true }
pgbearer-config = { workspace = true }
pgbearer-tls = { workspace = true }
pgbearer-auth = { workspace = true }
pgbearer-policy = { workspace = true }
pgbearer-pool = { workspace = true }
pgbearer-session = { workspace = true }
pgbearer-audit = { workspace = true }
pgbearer-telemetry = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "process"] }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
