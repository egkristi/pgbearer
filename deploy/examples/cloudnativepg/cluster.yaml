# CloudNativePG cluster prepared for pgbearer (strategy A: one client
# certificate + pg_ident map). Requires CloudNativePG 1.30+ (DatabaseRole) and
# cert-manager. pgbearer runs in the same namespace ("data") so a namespaced
# cert-manager Issuer can issue its client certificate.
#
# Apply order: cert-manager resources, then the Cluster, then the DatabaseRoles.
---
# 1. A client CA managed by cert-manager (user-provided client CA mode in CNPG).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: data
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orders-db-client-ca
  namespace: data
spec:
  isCA: true
  commonName: orders-db-client-ca
  secretName: orders-db-client-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: orders-db-client-ca
  namespace: data
spec:
  ca:
    secretName: orders-db-client-ca
---
# Replication client certificate, required by CNPG when the client CA is user-provided.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orders-db-replication
  namespace: data
spec:
  secretName: orders-db-replication
  commonName: streaming_replica
  usages: ["client auth"]
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: orders-db-client-ca
    kind: Issuer
---
# 2. The client certificate pgbearer uses to log in (CN=pgbearer).
#    pgbearer re-reads it from the mounted Secret when cert-manager renews it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgbearer-orders-client
  namespace: data
spec:
  secretName: pgbearer-orders-client
  commonName: pgbearer
  usages: ["client auth"]
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: orders-db-client-ca
    kind: Issuer
---
# 3. The cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db
  namespace: data
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: orders
      owner: orders_owner
  certificates:
    clientCASecret: orders-db-client-ca
    replicationTLSSecret: orders-db-replication
  # Only pgbearer pods may use certificate logins for pgbearer-reachable roles
  # (CNPG 1.29+; same-namespace selectors only).
  podSelectorRefs:
    - name: pgbearer
      selector:
        matchLabels:
          app.kubernetes.io/name: pgbearer
  postgresql:
    pg_ident:
      # The certificate with CN "pgbearer" may log in as any role that is a
      # (direct or indirect) member of pgbearer_login (PostgreSQL 16+).
      - "pgbearer pgbearer +pgbearer_login"
    pg_hba:
      # Must come before broader rules for these users (first match wins).
      - "hostssl all +pgbearer_login ${podselector:pgbearer} cert map=pgbearer"
      # Anyone else trying to use a pgbearer-reachable role is rejected.
      - "hostssl all +pgbearer_login all reject"
---
# 4. Roles (CNPG 1.30+ DatabaseRole). pgbearer_login is the gate: it has no
#    privileges itself; membership makes a role reachable through pgbearer.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pgbearer-login
  namespace: data
spec:
  cluster: { name: orders-db }
  name: pgbearer_login
  login: false
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: orders-readonly
  namespace: data
spec:
  cluster: { name: orders-db }
  name: orders_readonly
  login: true
  inRoles: [pgbearer_login, pg_read_all_data]
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: orders-app
  namespace: data
spec:
  cluster: { name: orders-db }
  name: orders_app
  login: true
  # Table privileges for orders_app are granted by the application's migrations.
  inRoles: [pgbearer_login]
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: orders-owner
  namespace: data
spec:
  cluster: { name: orders-db }
  name: orders_owner
  login: true
  inRoles: [pgbearer_login]
