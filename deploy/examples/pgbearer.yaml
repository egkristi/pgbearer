# Example pgbearer configuration: CloudNativePG cluster "orders-db",
# Microsoft Entra ID for people, Kubernetes ServiceAccounts for workloads,
# GitHub Actions for migrations.
apiVersion: pgbearer/v1alpha1
kind: ProxyConfig

admin:
  address: "0.0.0.0:9090"

listeners:
  - name: postgres
    address: "0.0.0.0:5432"
    tls:
      cert_file: /etc/pgbearer/tls/tls.crt
      key_file: /etc/pgbearer/tls/tls.key
      min_version: "1.2"
      direct_tls: true
    # PROXY protocol is off. To enable it behind a load balancer, set
    # proxy_protocol: required and list the load balancer networks in
    # trusted_proxies; headers from any other peer are rejected.
    proxy_protocol: "off"
    client_auth: token_password

identity_providers:
  - name: entra
    type: entra
    issuer: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0"
    audiences: ["11111111-1111-1111-1111-111111111111"]   # the pgbearer API's client ID
    tenants: ["00000000-0000-0000-0000-000000000000"]
    # People only; workloads use the k8s provider. Add "application" to
    # accept app-only tokens (they need the optional claim idtyp).
    token_profiles: [delegated]
    required_scopes: ["Database.Connect"]
    # User tokens must carry "acct" (enable the optional claim in the app
    # registration), so the guest deny rule below is never "unknown".
    required_claims: ["acct"]
  - name: k8s
    type: kubernetes
    audiences: ["pgbearer"]
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  - name: github
    type: github-actions
    audiences: ["pgbearer"]
    required_claims: ["repository_id", "event_name", "ref", "job_workflow_ref"]

backends:
  - name: orders
    cnpg:
      cluster: orders-db
      namespace: data
      service: rw
    tls:
      mode: verify-full
      ca_file: /etc/pgbearer/backends/orders/ca.crt
    login:
      method: cert
      cert_file: /etc/pgbearer/backends/orders/client/tls.crt
      key_file: /etc/pgbearer/backends/orders/client/tls.key
    pool:
      # Per replica. Budget (ARCHITECTURE §10.3): the cluster sets
      # max_connections 200; minus 3 superuser-reserved, ~5 CNPG-internal and
      # a margin of 12 leaves 180 usable. With 2 replicas, maxSurge 1 and up to
      # 2 pods draining, 5 pods x 30 = 150 <= 180.
      max_backend_connections: 30
      max_connections: 20
      acquire_timeout: 5s

routes:
  - match: { sni: "orders.db.example.com" }
    backend: orders
  - match: { databases: ["orders"] }
    backend: orders

policies:
  - name: orders-analysts
    when:
      issuer: entra
      roles_any: ["Orders.Analyst"]
    grant:
      backend: orders
      databases: ["orders"]
      pg_roles: ["orders_readonly"]
      default_pg_role: orders_readonly
      max_sessions_per_identity_per_replica: 5

  - name: orders-api
    when:
      issuer: k8s
      subject: "system:serviceaccount:orders:orders-api"
    grant:
      backend: orders
      databases: ["orders"]
      pg_roles: ["orders_app"]
      default_pg_role: orders_app

  - name: orders-migrations
    when:
      issuer: github
      # The subject names the repository and environment by (renamable) name;
      # the claims pin the immutable repository ID, the branch and the exact
      # workflow file. Protect the environment and the workflow in GitHub too.
      subject: "repo:acme/orders:environment:production"
      claims:
        - name: repository_id
          equals: "123456789"
        - name: ref
          equals: "refs/heads/main"
        - name: job_workflow_ref
          equals: "acme/orders/.github/workflows/migrate.yml@refs/heads/main"
    grant:
      backend: orders
      databases: ["orders"]
      pg_roles: ["orders_owner"]
      default_pg_role: orders_owner
      session_max_lifetime: 30m

deny:
  # Deny rules fail closed: a token without "acct" would match this rule,
  # which is why the entra provider lists it in required_claims.
  - name: no-guests
    when:
      issuer: entra
      claims:
        - name: acct
          equals: 1
  - name: no-pull-request-workflows
    when:
      issuer: github
      claims:
        - name: event_name
          any_of: ["pull_request", "pull_request_target"]

session:
  on_token_expiry: terminate_when_idle
  token_expiry_grace: 60s
  max_lifetime: 12h

audit:
  stdout: true
