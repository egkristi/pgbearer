[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/egkristi/pgbearer"
homepage = "https://github.com/egkristi/pgbearer"
authors = ["The pgbearer authors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[workspace.dependencies]
# Internal crates
pgbearer-core = { path = "crates/pgbearer-core" }
pgbearer-config = { path = "crates/pgbearer-config" }
pgbearer-wire = { path = "crates/pgbearer-wire" }
pgbearer-tls = { path = "crates/pgbearer-tls" }
pgbearer-auth = { path = "crates/pgbearer-auth" }
pgbearer-policy = { path = "crates/pgbearer-policy" }
pgbearer-audit = { path = "crates/pgbearer-audit" }
pgbearer-telemetry = { path = "crates/pgbearer-telemetry" }
pgbearer-pool = { path = "crates/pgbearer-pool" }
pgbearer-session = { path = "crates/pgbearer-session" }

# Async runtime and I/O
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
bytes = "1.12"
futures = "0.3.34"

# TLS
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
webpki-roots = "1.0.9"

# Auth
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
postgres-protocol = "0.6.12"
secrecy = "0.10.3"
zeroize = "1.9"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"

# Serialization and config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.3"
humantime = "2.4"
url = "2.5.8"
ipnet = { version = "2", features = ["serde"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "time"] }
prometheus-client = "0.25.1"

# HTTP admin server
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }

# Misc
thiserror = "2.0.21"
anyhow = "1.0.104"
arc-swap = "1.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
time = { version = "0.3", features = ["formatting", "serde"] }
hex = "0.4.3"

# Test-only
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
rcgen = "0.14.10"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1
